<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:14px system-ui;width:280px;padding:16px;background:#101827;color:#f5f7fb}h2{margin:0 0 12px}label{display:block;margin:12px 0 4px}textarea{box-sizing:border-box;width:100%;height:58px;background:#1d293b;color:white;border:1px solid #52627b;border-radius:6px;padding:7px}button{margin-top:12px;padding:9px 14px;border:0;border-radius:6px;background:#73a8ff;color:#071326;font-weight:700;cursor:pointer}.hint{font-size:11px;color:#b5c2d5}#status{min-height:16px}</style></head><body><h2>OriginFilter</h2><label><input id="enabled" type="checkbox"> Enable filtering</label><label>Blocked keywords (one per line)</label><textarea id="keywords"></textarea><label>Blocked account handles (one per line)</label><textarea id="blockedAccounts"></textarea><label>Hide text containing these scripts</label><label><input type="checkbox" name="lang" value="arabic"> Arabic script</label><label><input type="checkbox" name="lang" value="devanagari"> Devanagari script</label><label><input type="checkbox" name="lang" value="cyrillic"> Cyrillic script</label><label><input type="checkbox" name="lang" value="han"> Han characters</label><p class="hint">Script detection is not language or country detection. Filtering currently targets Instagram, Facebook and X web feeds only.</p><button id="save">Save settings</button><p id="status" role="status"></p><script src="popup.js"></script></body></html>
