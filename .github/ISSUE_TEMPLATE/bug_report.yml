name: Bug report
description: Something broke in the beta extension or a social website.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing OriginFilter. This is a **public issue**. Do not include credentials, login cookies, private messages or sensitive browsing data.
  - type: dropdown
    id: site
    attributes:
      label: Website
      options:
        - X
        - Facebook
        - YouTube
        - Extension popup or installation
        - Other
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Firefox desktop
        - Chrome desktop
        - Chromium / Brave / Edge desktop
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: "Example: A known non-English post is hidden."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      placeholder: "Example: The post stayed visible or the website became unresponsive."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (optional)
      placeholder: "Example: Enable English-only, open YouTube Home, reload the page."
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include passwords, tokens, login cookies, or private messages.
          required: true
